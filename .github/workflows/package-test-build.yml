name: Package test build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Verify addon versions
        run: |
          grep -F '## Version: 1.0.194' QFXSkillAlerts/QFXSkillAlerts.toc
          grep -F '## Version: 1.0.194' QFXSkillAlerts_Config/QFXSkillAlerts_Config.toc
      - name: Build test ZIP
        run: |
          mkdir -p package
          cp -a QFXSkillAlerts package/
          cp -a QFXSkillAlerts_Config package/
          cd package
          zip -r ../QFXSkillAlerts_1.0.194_dynamic_groups_TEST.zip QFXSkillAlerts QFXSkillAlerts_Config
      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QFXSkillAlerts-1.0.194-test
          path: QFXSkillAlerts_1.0.194_dynamic_groups_TEST.zip
          if-no-files-found: error
          retention-days: 1
