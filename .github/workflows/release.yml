name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage addons for packaging
        shell: bash
        run: |
          rm -rf QFXSkillAlerts/QFXSkillAlerts_Config
          cp -r QFXSkillAlerts_Config QFXSkillAlerts/QFXSkillAlerts_Config
          git add QFXSkillAlerts/QFXSkillAlerts_Config

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -t QFXSkillAlerts
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
