name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes outside the addon package
        run: |
          mkdir -p .release
          awk '/^## / { if (found) exit; found=1 } found { print }' CHANGELOG.md > .release/release-notes.md
          test -s .release/release-notes.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -n "QFXSkillAlerts_{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
